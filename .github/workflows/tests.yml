name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button on the Actions tab

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install typstyle
        run: cargo install --locked typstyle --version 0.15.2
      - name: Check Typst formatting
        run: typstyle --check src tests

  tests:
    runs-on: ubuntu-latest
    env:
      # tytanic 0.4.1 is built with Typst 0.15.1 (see README.md).
      TYTANIC_VERSION: 0.4.1
      TYPST_VERSION: 0.15.1
    steps:
      - uses: actions/checkout@v5

      - name: Install tytanic
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/typst-community/tytanic/releases/download/v${TYTANIC_VERSION}/tytanic-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ --strip-components=1 -C "$HOME/.local/bin" --wildcards '*/tt'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/tt" --version

      - name: Install Typst for layout-time style checks
        run: |
          curl -sSfL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ --strip-components=1 -C "$HOME/.local/bin" --wildcards '*/typst'

      # The reference images use New Computer Modern, including the sans and
      # mono variants, which are not embedded in Typst.
      - name: Download New Computer Modern fonts
        run: |
          curl -sSfL -o newcomputermodern.zip https://mirrors.ctan.org/fonts/newcomputermodern.zip
          unzip -q newcomputermodern.zip 'newcomputermodern/otf/*' -d "$RUNNER_TEMP/fonts"

      - name: Run tests
        run: tt run --no-fail-fast --font-path "$RUNNER_TEMP/fonts"

      - name: Check style override failures
        env:
          TYPST_FONT_PATHS: ${{ runner.temp }}/fonts
        run: python3 tests/style-checks/check.py
